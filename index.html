<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DevBook</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1b1d21;
            color: #e6e6e6;
            display: flex;
            flex-direction: column;
        }
        header {
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #16181b;
            border-bottom: 1px solid #2a2e33;
            user-select: none;
        }
        header .title { font-size: 12px; font-weight: 600; color: #9aa0a6; letter-spacing: 0.02em; }
        header button {
            -webkit-app-region: no-drag;
            background: none;
            border: none;
            color: #6b7177;
            font-size: 15px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 4px;
        }
        header button:hover { color: #e6e6e6; }
        header button.active { color: #e6e6e6; }

        /* Tab bar */
        .tabs {
            display: flex;
            gap: 2px;
            padding: 0 12px;
            background: #16181b;
            border-bottom: 1px solid #2a2e33;
        }
        .tabs button {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: #6b7177;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 8px 10px 7px;
            cursor: pointer;
        }
        .tabs button:hover { color: #c8ccd0; }
        .tabs button.active { color: #e6e6e6; border-bottom-color: #5b8def; }

        /* Tab panels */
        .panel { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px; overflow: hidden; }
        .panel[hidden] { display: none; }

        textarea {
            width: 100%;
            min-height: 64px;
            resize: none;
            background: #26292e;
            border: 1px solid #3a3e44;
            border-radius: 8px;
            color: #fff;
            padding: 9px 11px;
            font: inherit;
        }
        textarea:focus { outline: none; border-color: #5b8def; }
        .hint { font-size: 11px; color: #6b7177; }
        .time-row { display: flex; align-items: center; gap: 8px; }
        .time-row label { font-size: 11px; color: #6b7177; }
        .time-row input[type=time] {
            background: #26292e;
            border: 1px solid #3a3e44;
            border-radius: 6px;
            color: #fff;
            padding: 3px 7px;
            font: inherit;
            font-size: 12px;
        }
        .entries {
            flex: 1;
            overflow-y: auto;
            background: #16181b;
            border: 1px solid #2a2e33;
            border-radius: 8px;
            padding: 6px;
            font: 12px/1.5 "SF Mono", ui-monospace, Menlo, monospace;
            color: #c8ccd0;
        }
        .row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding: 5px 6px;
            border-radius: 6px;
        }
        .row:hover { background: #20242a; }
        .row .text { flex: 1; white-space: pre-wrap; word-break: break-word; }
        .row .del {
            flex: none;
            visibility: hidden;
            background: none;
            border: none;
            color: #6b7177;
            cursor: pointer;
            font-size: 12px;
            line-height: 1.3;
            padding: 0 2px;
        }
        .row:hover .del { visibility: visible; }
        .row .del:hover { color: #e05260; }
        .row .edit {
            flex: none;
            visibility: hidden;
            background: none;
            border: none;
            color: #6b7177;
            cursor: pointer;
            font-size: 12px;
            line-height: 1.3;
            padding: 0 2px;
        }
        .row:hover .edit { visibility: visible; }
        .row .edit:hover { color: #5b8def; }
        .row .edit-input {
            flex: 1;
            background: #26292e;
            border: 1px solid #5b8def;
            border-radius: 4px;
            color: #fff;
            font: inherit;
            font-family: "SF Mono", ui-monospace, Menlo, monospace;
            font-size: 12px;
            padding: 2px 5px;
        }
        .row .edit-input:focus { outline: none; }
        .empty { color: #6b7177; font-style: italic; padding: 6px; }

        /* Shared form controls (sprint tab + settings panel) */
        .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .field label { font-size: 12px; color: #9aa0a6; }
        input[type=date], input[type=number] {
            background: #26292e;
            border: 1px solid #3a3e44;
            border-radius: 6px;
            color: #fff;
            padding: 4px 8px;
            font: inherit;
            font-size: 12px;
        }
        input[type=date]:focus, input[type=number]:focus { outline: none; border-color: #5b8def; }
        .check { display: flex; align-items: center; gap: 6px; color: #c8ccd0; cursor: pointer; font-size: 13px; }
        .btn-primary {
            background: #5b8def;
            border: none;
            border-radius: 6px;
            color: #fff;
            padding: 8px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-primary:hover { background: #4a7ce0; }
        .btn-primary:disabled { opacity: 0.6; cursor: default; }
        .btn-muted {
            background: #2a2e33;
            border: 1px solid #3a3e44;
            border-radius: 6px;
            color: #e6e6e6;
            padding: 7px;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-muted:hover { background: #333840; }
        .status { font-size: 11px; color: #6b7177; min-height: 14px; }
        .status.err { color: #e05260; }
        .status.ok { color: #5fb87a; }
        .range { font-size: 11px; color: #8a9ac0; }

        /* Settings panel (cog) */
        .settings-panel {
            background: #1d2330;
            border-bottom: 1px solid #2a2e33;
            border-left: 3px solid #5b8def;
            box-shadow: inset 0 1px 0 rgba(91, 141, 239, 0.15);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .settings-panel[hidden] { display: none; }
        .settings-group { display: flex; flex-direction: column; gap: 8px; }
        .settings-group[hidden] { display: none; }
        .settings-panel .head { font-size: 11px; font-weight: 600; color: #6b7177; letter-spacing: 0.04em; text-transform: uppercase; }
        .set-label { font-size: 12px; color: #9aa0a6; }
        .set-text {
            width: 100%;
            background: #26292e;
            border: 1px solid #3a3e44;
            border-radius: 6px;
            color: #fff;
            padding: 5px 8px;
            font: inherit;
            font-size: 12px;
        }
        .set-text:focus { outline: none; border-color: #5b8def; }

        /* Git tab commit list */
        .commits {
            flex: 1;
            overflow-y: auto;
            background: #16181b;
            border: 1px solid #2a2e33;
            border-radius: 8px;
            padding: 8px;
            font: 12px/1.5 "SF Mono", ui-monospace, Menlo, monospace;
            color: #c8ccd0;
        }
        .commits .repo { color: #8a9ac0; font-weight: 600; margin: 8px 0 3px; }
        .commits .repo:first-child { margin-top: 0; }
        .commits .commit { display: flex; gap: 6px; padding: 1px 0; }
        .commits .commit .date { color: #6b7177; flex: none; }
        .commits .commit .hash { color: #c08a4a; flex: none; }
        .commits .commit .subj { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <header>
        <span class="title">DevBook</span>
        <span>
            <button id="settings-toggle" title="Sprint settings">⚙</button>
            <button id="close" title="Close">✕</button>
        </span>
    </header>

    <div class="tabs">
        <button id="tab-notes" class="active">Notes</button>
        <button id="tab-sprint">Sprint</button>
        <button id="tab-git">Git</button>
    </div>

    <div class="settings-panel" id="settings-panel" hidden>
        <div class="settings-group" id="settings-notes" hidden>
            <div class="head">Notes settings</div>
            <div class="hint">No notes settings yet.</div>
        </div>
        <div class="settings-group" id="settings-sprint" hidden>
            <div class="head">Sprint settings</div>
            <div class="field"><label for="set-anchor">Start date of a known sprint</label><input type="date" id="set-anchor"></div>
            <div class="field"><label for="set-length">Sprint length (days)</label><input type="number" id="set-length" min="1" max="60" style="width:64px"></div>
            <button class="btn-muted" id="set-save">Save</button>
            <div class="status" id="set-status"></div>
        </div>
        <div class="settings-group" id="settings-git" hidden>
            <div class="head">Git settings</div>
            <label class="set-label" for="set-git-parent">Repos folder (scanned one level deep)</label>
            <input type="text" id="set-git-parent" class="set-text" placeholder="/Users/you/code/docker">
            <label class="set-label" for="set-git-authors">Your commit emails (comma-separated)</label>
            <input type="text" id="set-git-authors" class="set-text" placeholder="you@work.com, you@other.com">
            <button class="btn-muted" id="set-git-save">Save</button>
            <div class="status" id="set-git-status"></div>
        </div>
    </div>

    <!-- Notes tab -->
    <main class="panel" id="panel-notes">
        <textarea id="note" autofocus placeholder="Jot a note… (Enter to save, Shift+Enter for a new line)"></textarea>
        <div class="time-row">
            <label for="note-date">Day</label>
            <input type="date" id="note-date">
            <label for="note-time">Time</label>
            <input type="time" id="note-time">
        </div>
        <div class="entries" id="entries"><span class="empty">Loading…</span></div>
    </main>

    <!-- Sprint tab -->
    <main class="panel" id="panel-sprint" hidden>
        <div class="field"><label for="sp-date">Summarise the sprint containing</label><input type="date" id="sp-date"></div>
        <div class="range" id="sp-range"></div>
        <label class="check"><input type="checkbox" id="sp-ai"> AI-written summary</label>
        <label class="check"><input type="checkbox" id="sp-git" checked> Include git commits</label>
        <button class="btn-primary" id="sp-go">Generate sprint summary</button>
        <button class="btn-muted" id="sp-month">Summarise last 30 days</button>
        <div class="status" id="sp-status"></div>
        <button class="btn-muted" id="sp-copy" hidden>Copy summary to clipboard</button>
    </main>

    <!-- Git tab -->
    <main class="panel" id="panel-git" hidden>
        <div class="field"><label for="git-date">Commits in the sprint containing</label><input type="date" id="git-date"></div>
        <div class="range" id="git-range"></div>
        <div class="commits" id="git-list"><span class="empty">Loading…</span></div>
        <div class="status" id="git-status"></div>
    </main>

    <script>
        const ta = document.getElementById('note');
        const box = document.getElementById('entries');
        const noteDate = document.getElementById('note-date');

        // The day the Notes tab is viewing/editing; defaults to today.
        function currentDay() { return noteDate.value || todayISO(); }

        function render(notes) {
            box.innerHTML = '';
            if (!notes || notes.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = 'No notes for this day.';
                box.appendChild(empty);
                return;
            }
            notes.forEach((note, i) => {
                const row = document.createElement('div');
                row.className = 'row';

                const text = document.createElement('span');
                text.className = 'text';
                text.textContent = note;

                const edit = document.createElement('button');
                edit.className = 'edit';
                edit.textContent = '✎';
                edit.title = 'Edit this note';
                edit.addEventListener('click', () => startEdit(row, text, note, i));

                const del = document.createElement('button');
                del.className = 'del';
                del.textContent = '✕';
                del.title = 'Delete this note';
                del.addEventListener('click', async () => {
                    render(await window.api.delete(i, currentDay()));
                });

                row.append(text, edit, del);
                box.appendChild(row);
            });
            box.scrollTop = box.scrollHeight;
        }

        async function refresh() { render(await window.api.read(currentDay())); }

        // Replace a note row's text with an inline input. Enter commits, Escape
        // or an unchanged value cancels. A guard prevents double-commit when the
        // commit re-render strips the input and triggers a trailing blur.
        function startEdit(row, textEl, current, index) {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'edit-input';
            input.value = current;
            row.replaceChild(input, textEl);
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);

            let done = false;
            const commit = async () => {
                if (done) return;
                done = true;
                const v = input.value.trim();
                if (v === '' || v === current) { refresh(); return; }
                render(await window.api.edit(index, v, currentDay()));
            };
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); commit(); }
                else if (e.key === 'Escape') { e.preventDefault(); done = true; refresh(); }
            });
            input.addEventListener('blur', commit);
        }

        const timeInput = document.getElementById('note-time');

        ta.addEventListener('keydown', async e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const v = ta.value.trim();
                if (v === '') return;
                const updated = await window.api.append(v, timeInput.value, currentDay());
                ta.value = '';
                timeInput.value = '';
                render(updated);
            }
        });

        noteDate.addEventListener('change', refresh);

        document.getElementById('close').addEventListener('click', () => window.api.close());

        // --- Tabs ---
        const tabs = {
            notes: { btn: document.getElementById('tab-notes'), panel: document.getElementById('panel-notes') },
            sprint: { btn: document.getElementById('tab-sprint'), panel: document.getElementById('panel-sprint') },
            git: { btn: document.getElementById('tab-git'), panel: document.getElementById('panel-git') },
        };

        let activeTab = 'notes';

        function showTab(name) {
            activeTab = name;
            for (const [key, t] of Object.entries(tabs)) {
                const on = key === name;
                t.panel.hidden = !on;
                t.btn.classList.toggle('active', on);
            }
            if (name === 'notes') ta.focus();
            else if (name === 'sprint') loadSprint();
            else if (name === 'git') loadGit();
            // Keep the (open) settings panel in step with the active tab.
            if (!setPanel.hidden) syncSettings();
        }
        for (const [key, t] of Object.entries(tabs)) {
            t.btn.addEventListener('click', () => showTab(key));
        }

        // --- Settings (cog), context-sensitive to the active tab ---
        const setPanel = document.getElementById('settings-panel');
        const setGroups = {
            notes: document.getElementById('settings-notes'),
            sprint: document.getElementById('settings-sprint'),
            git: document.getElementById('settings-git'),
        };
        const setAnchor = document.getElementById('set-anchor');
        const setLength = document.getElementById('set-length');
        const setStatus = document.getElementById('set-status');
        const setGitParent = document.getElementById('set-git-parent');
        const setGitAuthors = document.getElementById('set-git-authors');
        const setGitStatus = document.getElementById('set-git-status');

        async function syncSettings() {
            for (const [key, g] of Object.entries(setGroups)) g.hidden = key !== activeTab;
            if (activeTab === 'notes') return;
            const s = await window.api.getSettings();
            if (activeTab === 'sprint') {
                setStatus.textContent = '';
                setAnchor.value = s.anchor;
                setLength.value = s.lengthDays;
            } else if (activeTab === 'git') {
                setGitStatus.textContent = '';
                setGitParent.value = s.gitParent || '';
                setGitAuthors.value = (s.gitAuthors || []).join(', ');
            }
        }

        document.getElementById('settings-toggle').addEventListener('click', async () => {
            setPanel.hidden = !setPanel.hidden;
            if (!setPanel.hidden) await syncSettings();
        });

        document.getElementById('set-save').addEventListener('click', async () => {
            await window.api.saveSettings({ anchor: setAnchor.value, lengthDays: setLength.value });
            setStatus.className = 'status ok';
            setStatus.textContent = 'Saved.';
            await updateRange();
        });

        document.getElementById('set-git-save').addEventListener('click', async () => {
            await window.api.saveSettings({ gitParent: setGitParent.value, gitAuthors: setGitAuthors.value });
            setGitStatus.className = 'status ok';
            setGitStatus.textContent = 'Saved.';
            if (activeTab === 'git') loadGit();
        });

        // --- Sprint summary ---
        const spDate = document.getElementById('sp-date');
        const spRange = document.getElementById('sp-range');
        const spAi = document.getElementById('sp-ai');
        const spGo = document.getElementById('sp-go');
        const spStatus = document.getElementById('sp-status');

        function todayISO() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        }

        // The reference date shared by the Sprint and Git tabs, so changing it on
        // one carries over to the other.
        let pickedDate = '';

        // Show the sprint window that the chosen day falls into, derived from anchor + length.
        async function updateRange() {
            const w = await window.api.sprintWindow(pickedDate || todayISO());
            spRange.textContent = `${w.start} → ${w.end}`;
        }

        async function loadSprint() {
            spStatus.textContent = '';
            if (!pickedDate) pickedDate = todayISO();
            spDate.value = pickedDate;
            await updateRange();
        }

        spDate.addEventListener('change', () => {
            pickedDate = spDate.value || todayISO();
            updateRange();
        });

        const spGit = document.getElementById('sp-git');
        const spMonth = document.getElementById('sp-month');
        const spCopy = document.getElementById('sp-copy');
        let lastContent = '';

        function showResult(r) {
            if (r.error) {
                spStatus.className = 'status err';
                spStatus.textContent = r.error;
                return;
            }
            lastContent = r.content || '';
            spCopy.hidden = !lastContent;
            let msg = `Saved ${r.notes} note(s) across ${r.days} day(s) (${r.start} → ${r.end}).`;
            if (spGit.checked) msg += ` ${r.commits || 0} commit(s).`;
            if (spAi.checked && r.aiUsed) msg += ' AI summary included.';
            if (spAi.checked && r.aiError) msg += ` AI skipped: ${r.aiError}`;
            spStatus.className = 'status ' + (r.aiError ? 'err' : 'ok');
            spStatus.textContent = msg;
        }

        async function runGenerate(fn) {
            spStatus.className = 'status';
            spStatus.textContent = spAi.checked ? 'Generating (calling AI)…' : 'Generating…';
            spGo.disabled = spMonth.disabled = true;
            spCopy.hidden = true;
            const r = await fn();
            spGo.disabled = spMonth.disabled = false;
            showResult(r);
        }

        spGo.addEventListener('click', () =>
            runGenerate(() => window.api.generateSprint({ date: pickedDate || todayISO(), ai: spAi.checked, git: spGit.checked })));
        spMonth.addEventListener('click', () =>
            runGenerate(() => window.api.generateMonth({ ai: spAi.checked, git: spGit.checked })));
        spCopy.addEventListener('click', async () => {
            await window.api.copyText(lastContent);
            spStatus.className = 'status ok';
            spStatus.textContent = 'Copied to clipboard.';
        });

        // --- Git tab ---
        const gitDate = document.getElementById('git-date');
        const gitRange = document.getElementById('git-range');
        const gitList = document.getElementById('git-list');
        const gitStatus = document.getElementById('git-status');

        function renderCommits(data) {
            gitList.innerHTML = '';
            if (!data.total) {
                const empty = document.createElement('span');
                empty.className = 'empty';
                empty.textContent = data.scanned
                    ? `No commits by you in this window (scanned ${data.scanned} repo(s)).`
                    : 'No repos found. Set the repos folder under ⚙.';
                gitList.appendChild(empty);
                return;
            }
            for (const r of data.repos) {
                const head = document.createElement('div');
                head.className = 'repo';
                head.textContent = `${r.repo} (${r.commits.length})`;
                gitList.appendChild(head);
                for (const c of r.commits) {
                    const [date, hash, ...rest] = c.split('\t');
                    const row = document.createElement('div');
                    row.className = 'commit';
                    const d = document.createElement('span'); d.className = 'date'; d.textContent = date;
                    const h = document.createElement('span'); h.className = 'hash'; h.textContent = hash;
                    const s = document.createElement('span'); s.className = 'subj'; s.textContent = rest.join(' ');
                    row.append(d, h, s);
                    gitList.appendChild(row);
                }
            }
        }

        async function loadGit() {
            if (!pickedDate) pickedDate = todayISO();
            gitDate.value = pickedDate;
            gitStatus.textContent = '';
            gitList.innerHTML = '<span class="empty">Scanning…</span>';
            const data = await window.api.gitCommits(pickedDate);
            gitRange.textContent = `${data.start} → ${data.end}`;
            renderCommits(data);
            if (data.errors && data.errors.length) {
                gitStatus.className = 'status err';
                gitStatus.textContent = data.errors.join(' · ');
            }
        }

        gitDate.addEventListener('change', () => {
            pickedDate = gitDate.value || todayISO();
            loadGit();
        });

        noteDate.value = todayISO();
        refresh();
    </script>
</body>
</html>
